services:
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: library_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-prootpassword",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: library-api
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      APP_PORT: 8080
      APP_ENV: production

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: library_user
      DB_PASSWORD: library_password
      DB_NAME: library_db

      JWT_SECRET: change-this-production-secret
      JWT_EXPIRE_HOURS: 24

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
